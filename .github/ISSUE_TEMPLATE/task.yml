name: Technical task
description: Define repository, infrastructure, documentation, or engineering work
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for technical work that does not directly introduce a
        user-facing feature, such as configuration, documentation, refactoring,
        infrastructure, or developer tooling.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the technical outcome required by this task.
      placeholder: What should be true when this task is completed?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this work is needed.
      placeholder: Include relevant background, constraints, or dependencies.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the work included in this task.
      placeholder: |
        - First scoped change
        - Second scoped change
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: List related work that must not be included.
      placeholder: |
        - Related change deferred to another issue
        - Unrelated refactoring

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List objective and verifiable completion conditions.
      placeholder: |
        - [ ] First acceptance criterion
        - [ ] Second acceptance criterion
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Technical area
      description: Select the primary area affected by this task.
      options:
        - Backend
        - Database
        - Security
        - Testing
        - Documentation
        - Developer experience
        - CI/CD
        - Infrastructure
      default: 0
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Explain how the result will be tested or verified.
      placeholder: Commands, automated tests, manual checks, or review steps.
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: List all conditions required before closing the issue.
      placeholder: |
        - [ ] Implementation is complete
        - [ ] Validation passes
        - [ ] Pull request is reviewed
        - [ ] Documentation is updated
    validations:
      required: true

  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness checklist
      options:
        - label: I verified that an equivalent open issue does not already exist.
          required: true
        - label: This task contains one cohesive technical change.
          required: true
